# Claim verification settings (step 2b). Read by verify/settings.py.
model: claude-fable-5-1       # the verifier: web search on, one call per claim
effort: low
max_claims_per_draft: 50      # per-draft cost bound: one web call per claim; claims past it stay
                              # "unchecked" on the queue page until the cap is raised
max_searches_per_claim: 5     # web_search max_uses on the API backend
timeout_seconds: 240          # per claim, claude_code backend

# Comparison tables (draft/chart.py:Table). The drafter may propose a table whose cells go
# beyond the source article; run_verify.py checks every cell that is not verbatim in the
# article with one web-search call each, blanks the cells it cannot tie to a trusted
# primary source, drops the table on a contradicted cell or when too few cells pass, and
# only then draws the picture. enabled: false leaves tables unverified and unrendered.
tables:
  enabled: true
  max_cells_per_draft: 50     # bigger tables are dropped before any call
  min_supported_ratio: 0.6    # fewer verified fact cells than this share -> table dropped

# The verify-revise loop (verify/autorevise.py). When on, a draft left with a contradicted
# or unverified claim after the claim pass is sent back through the drafter with those
# claims (the same call as the queue's Revise button with an empty box), its supported
# verdicts are kept, the new or changed claims are checked, and so on until every claim is
# supported or a limit is hit. Each round costs one drafter call plus one web call per new
# claim. Tables are not part of the loop. `--auto-revise` / `--no-auto-revise` on
# run_verify.py override `enabled` for one run.
auto_revise:
  enabled: true
  max_rounds: 3               # rounds per draft per run
  max_rounds_per_draft: 0     # automatic revisions over the draft's whole life; 0 = no cap.
                              # A positive number makes the draft wait for a human after that
                              # many ("auto-revise gave up" on the queue)

# A "supported" or "contradicted" verdict counts as verified only when the source is on
# one of these hosts (subdomains included). Anything else is shown as a lead the human
# must check. Company domains are not listed: a press release on the company's own site is
# matched through the root config.yaml (the host of each companies.feeds URL, a feed's
# `domain:`, and the `domain:` of each branding.companies entry).
trusted_domains:
  - clinicaltrials.gov
  - pubmed.ncbi.nlm.nih.gov
  - ncbi.nlm.nih.gov
  - fda.gov
  - sec.gov
  - nejm.org
  - thelancet.com
  - nature.com
  - science.org
  - ashpublications.org
  - ascopubs.org
  - aacrjournals.org
  - cell.com
  - jamanetwork.com
  - biorxiv.org
  - medrxiv.org
  - ema.europa.eu
  - businesswire.com
  - globenewswire.com
  - prnewswire.com
  - learn.astct.org
