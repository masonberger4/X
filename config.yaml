# All pipeline behaviour is driven from this file. No URLs, queries, or model
# names live in code.

db_path: pipeline.db

http:
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) cancer-news-pipeline/0.1"

ncbi:
  email: masonpberger@gmail.com   # Entrez.email (NCBI etiquette)
  tool: cancer-news-pipeline

models:
  scorer: claude-haiku-4-5        # cheap model for rubric scoring (PLAN.md step 2)

scoring:
  batch_size: 10                  # clusters per API call
  max_tokens: 4096
  threshold: 30                   # total (0-70) needed to appear in the digest
  max_retries: 5
  backoff_seconds: 2              # base for exponential backoff
  # Fable/Mythos models reject forced tool_choice; set false to fall back to
  # "auto" + a prompt instruction for those models.
  force_tool_choice: true
  abstract_max_chars: 2500        # truncate abstracts sent to the model

prefilter:
  require_abstract: true
  min_abstract_chars: 200
  daily_cap: 60                   # max clusters sent to the scorer per UTC day
  allow_keywords:                 # at least one must appear in title+abstract
    - cancer
    - tumor
    - tumour
    - oncolog
    - carcinoma
    - leukemia
    - leukaemia
    - lymphoma
    - myeloma
    - melanoma
    - sarcoma
    - glioma
    - glioblastoma
    - metasta
    - neoplas
    - malignan
    - CAR-T
    - CAR T
    - checkpoint inhibitor
    - PD-1
    - PD-L1
    - antibody-drug conjugate
    - bispecific
  deny_keywords:                  # any of these drops the item
    - horoscope
    - cannabis stock
    - press release distribution
    - webinar
    - job posting
    - conference registration

dedup:
  title_similarity: 0.92          # difflib ratio for near-duplicate clustering
  near_dup_window_days: 14        # only compare against clusters this recent

expertise:
  # Topics that earn the expertise_fit bonus in the rubric.
  bonus_topics:
    - CAR-T / CAR-NK / TCR-T cell therapy
    - TILs and other adoptive cell therapy
    - in vivo CAR
    - CRISPR / base editing / prime editing
    - gene therapy vectors for oncology

digest:
  top_n: 10
  window_hours: 24

# Sources. `type` selects the ingester; `cadence_minutes` controls how often
# run_ingest.py fetches it. `enabled: false` skips a source without deleting it.
sources:
  # --- journals / preprints / news (RSS or Atom) ---
  - name: nature_medicine
    type: rss
    url: https://www.nature.com/nm.rss
    cadence_minutes: 360
  - name: nature_cancer
    type: rss
    url: https://www.nature.com/natcancer.rss
    cadence_minutes: 360
  - name: nejm
    type: rss
    url: https://www.nejm.org/action/showFeed?jc=nejm&type=etoc&feed=rss
    cadence_minutes: 720
  - name: lancet_oncology
    type: rss
    url: https://www.thelancet.com/rssfeed/lanonc_current.xml
    cadence_minutes: 720
  - name: jco
    type: rss
    url: https://ascopubs.org/action/showFeed?type=etoc&feed=rss&jc=jco
    cadence_minutes: 720
  # EurekAlert no longer publishes topic RSS feeds; bioRxiv/medRxiv retired their
  # RSS feeds and are ingested through the JSON API below (type: biorxiv).
  - name: fda_press
    type: rss
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml
    cadence_minutes: 60

  # --- structured / API sources ---
  - name: biorxiv_cancer_biology
    type: biorxiv
    server: biorxiv
    api_url: https://api.biorxiv.org/details
    category: cancer_biology
    lookback_days: 2
    max_pages: 5
    cadence_minutes: 180
  - name: medrxiv_oncology
    type: biorxiv
    server: medrxiv
    api_url: https://api.medrxiv.org/details
    category: oncology
    lookback_days: 2
    max_pages: 5
    cadence_minutes: 180
  - name: fda_oce_approvals
    type: fda_oce
    url: https://www.fda.gov/drugs/resources-information-approved-drugs/oncology-cancer-hematologic-malignancies-approval-notifications
    cadence_minutes: 120
  - name: clinicaltrials_oncology
    type: clinicaltrials
    url: https://clinicaltrials.gov/api/v2/studies
    cadence_minutes: 360
    lookback_days: 2
    page_size: 100
    max_pages: 3
    query_cond: cancer OR neoplasm OR carcinoma OR lymphoma OR leukemia OR myeloma
    query_intr: ""
    phases: [PHASE2, PHASE3]
    statuses: [RECRUITING, ACTIVE_NOT_RECRUITING, COMPLETED]
  - name: pubmed_oncology
    type: pubmed
    cadence_minutes: 180
    lookback_days: 2
    max_results: 100
    query: >-
      (neoplasms[MeSH Major Topic]) AND
      (clinical trial[pt] OR randomized controlled trial[pt]) AND english[la]
  - name: pubmed_immunotherapy
    type: pubmed
    cadence_minutes: 180
    lookback_days: 2
    max_results: 100
    query: >-
      (immunotherapy OR "immune checkpoint" OR bispecific OR
      "antibody-drug conjugate") AND (cancer OR tumor OR neoplasm) AND english[la]
  - name: pubmed_cell_gene_therapy
    type: pubmed
    cadence_minutes: 180
    lookback_days: 3
    max_results: 100
    query: >-
      ("chimeric antigen receptor" OR CAR-T OR "cell therapy" OR CRISPR OR
      "gene editing" OR "base editing") AND (cancer OR tumor OR leukemia OR
      lymphoma OR myeloma) AND english[la]

