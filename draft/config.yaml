# Step 7 (voice learning loop) settings. This is draft/'s own file, NOT the root
# config.yaml. Loaded by draft.settings.load_draft_config().

examples:
  enabled: true
  lookback_days: 60
  max_examples: 6          # BEFORE/AFTER pairs shown to the drafter
  max_rejections: 4        # rejected post + reason
  max_chars_per_post: 600  # longer posts are cut with a visible "[...]"
  min_change_ratio: 0.08   # 1 - difflib ratio; typo-level edits teach nothing and are skipped
  skip_categories: [factual, hard_rule]   # edits that fix facts/rules are not voice lessons

report:
  weeks: 4
  top_pairs: 10
  propose_banned_after: 3  # a phrase the human deleted this many times -> proposed banned phrase
  # Note words that, recurring in edit/reject notes, become a 'tone' proposal.
  tone_words: [hype, hypey, jargon, vague, wordy, clickbait, breathless, salesy, generic, flat, dry, padded]
  stopwords: [the, a, an, and, or, of, to, in, on, for, with, at, by, from, is, are, was,
              were, be, been, it, its, this, that, these, those, as, but, not, no, than,
              so, if, into, about, over, after, before, we, they, their, our, you, your,
              i, he, she, his, her, them, us, has, have, had, do, does, did, will, would,
              can, could, may, might, should, here, there, what, which, who, when, where,
              how, why, all, any, some, more, most, very, just, only, also, then, still,
              yet, now, out, up, down, off, per, vs, via, s, t]

# Draft images (draft/chart.py). The drafter returns an optional bar-chart spec whose
# numbers are checked against the source; run_draft.py renders it to
# <db folder>/images/draft_<id>.png with matplotlib (`pip install -e ".[images]"`). The
# queue shows it, a human can drop it, and run_publish.py attaches it to the first post.
# enabled: false keeps the spec in drafts.chart_json but renders and attaches nothing.
images:
  enabled: true
  # The image grader (draft/grader.py): a second model looks at the rendered PNG and scores
  # it 1-10 on readability, use of colour and graphics, and limited negative space. Under
  # min_score the renderer applies the grader's layout-knob changes and draws again, up to
  # max_iterations renders; the best-scoring render is kept and every grade is stored in
  # image_grades (shown on the queue's draft page). It only ever moves layout knobs
  # (draft.chart.Style), never a number or a label. IMAGE_GRADER_MODEL env or root
  # config.yaml `models.image_grader` override the model; an empty model disables it.
  grader:
    enabled: true
    model: claude-sonnet-5
    min_score: 8
    max_iterations: 4

# Fallback drafting model only. Resolution order (draft.drafter.model_name):
# DRAFT_MODEL env, then root config.yaml `models.drafter` if the human has added
# that key, then this value.
model: claude-sonnet-5
