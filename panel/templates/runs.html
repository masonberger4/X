{% extends "base.html" %}
{% block title %}Runs{% endblock %}
{% block content %}
<h1>Runs</h1>
{% if error %}<p class="flash low">{{ error }}</p>{% endif %}
<form method="post" action="/runs">
  {% for s in steps %}
  <label style="margin-right:1rem">
    <input type="checkbox" name="step" value="{{ s.name }}" {% if not s.enabled %}disabled{% endif %}>
    {{ s.name }}{% if not s.enabled %} <span class="meta">(disabled)</span>{% endif %}
  </label>
  {% endfor %}
  <div class="actions"><button type="submit">Run selected steps</button></div>
</form>
<div id="jobs">{% include "_jobs.html" %}</div>
<script>
(function () {
  var box = document.getElementById("jobs");
  function isRunning() {
    var flag = box.querySelector("#run-state");
    return flag !== null && flag.getAttribute("data-running") === "1";
  }
  function poll() {
    fetch("/runs/current", {headers: {"Accept": "text/html"}})
      .then(function (r) { return r.text(); })
      .then(function (html) {
        // Replacing the fragment recreates every scrollable <pre class="log"> and
        // every <details>, so remember where the reader was and put it back.
        var logs = Array.prototype.map.call(box.querySelectorAll("pre.log"), function (el) {
          return {top: el.scrollTop, atBottom: el.scrollTop + el.clientHeight >= el.scrollHeight - 2};
        });
        var open = Array.prototype.map.call(box.querySelectorAll("details.run"), function (el) {
          return el.open;
        });
        box.innerHTML = html;
        box.querySelectorAll("details.run").forEach(function (el, i) {
          if (i < open.length) { el.open = open[i]; }
        });
        box.querySelectorAll("pre.log").forEach(function (el, i) {
          if (i >= logs.length) { return; }
          el.scrollTop = logs[i].atBottom ? el.scrollHeight : logs[i].top;
        });
        if (isRunning()) { setTimeout(poll, 2000); }
      })
      .catch(function () { setTimeout(poll, 5000); });
  }
  if (isRunning()) { setTimeout(poll, 2000); }
})();
</script>
{% endblock %}
