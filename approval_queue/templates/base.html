<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Approval queue{% endblock %}</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    .post { white-space: pre-wrap; border: 1px solid #ccc; border-radius: 6px; padding: .6rem .8rem; margin: .4rem 0; background: #fafafa; }
    .meta { color: #666; font-size: .9em; }
    .over { color: #b00020; font-weight: bold; }
    .low { color: #b00020; } .medium { color: #b26a00; } .high { color: #2e7d32; }
    .wrap { overflow-wrap: anywhere; word-break: break-word; }
    form.inline { display: inline; }
    form.revise { display: flex; gap: .4rem; margin-top: .3rem; }
    form.revise input { flex: 1; font: inherit; }
    textarea { width: 100%; font: inherit; }
    button { margin-right: .5rem; }
    .actions { margin: 1rem 0; }
    .flash { background: #fff8e1; padding: .5rem; border-radius: 6px; }
    pre.diff { white-space: pre-wrap; font: 13px/1.4 ui-monospace, monospace; background: #fafafa; border: 1px solid #ddd; border-radius: 6px; padding: .5rem; margin: .3rem 0; }
    .diff .del { background: #fde7e9; color: #8a1c1c; text-decoration: line-through; display: block; }
    .diff .add { background: #e6f4ea; color: #1b5e20; display: block; }
    .diff .same { color: #666; display: block; }
    .proposal { border-left: 4px solid #2e7d32; padding: .3rem .8rem; margin: .5rem 0; background: #f6fbf6; }
    .caveats { color: #666; font-size: .9em; }
    select { font: inherit; }
    .check { border-left: 4px solid #999; padding: .2rem .8rem; margin: .3rem 0 .6rem; background: #fafafa; }
    .check.supported { border-color: #2e7d32; } .check.contradicted { border-color: #b00020; background: #fff5f5; }
    .check blockquote { margin: .3rem 0; padding-left: .6rem; border-left: 2px solid #ccc; color: #444; font-style: italic; }
    .badge { display: inline-block; font-size: .8em; padding: 0 .4em; border-radius: 4px; background: #eee; margin-right: .2em; }
    nav .sep { color: #bbb; margin-right: 1rem; }
    .pill { display: inline-block; font-size: .8em; font-weight: 600; padding: .05em .5em; border-radius: 10px; text-transform: uppercase; letter-spacing: .03em; }
    .pill.ok { background: #e6f4ea; color: #1b5e20; }
    .pill.warn { background: #fff4e5; color: #8a5000; }
    .pill.fail { background: #fde7e9; color: #8a1c1c; }
    .pill.skip { background: #eee; color: #555; }
    .banner { border-radius: 8px; padding: .7rem 1rem; margin: 1rem 0; font-weight: 600; }
    .banner.ok { background: #e6f4ea; color: #1b5e20; }
    .banner.warn { background: #fff4e5; color: #8a5000; }
    .banner.fail { background: #fde7e9; color: #8a1c1c; }
    .cards { display: flex; flex-wrap: wrap; gap: .6rem; margin: .6rem 0 1.2rem; }
    .card { flex: 1 1 150px; border: 1px solid #ddd; border-radius: 8px; padding: .5rem .7rem; }
    .card .n { font-size: 1.4em; font-weight: 600; }
    pre.log { white-space: pre-wrap; font: 12px/1.45 ui-monospace, monospace; background: #f6f6f6; border: 1px solid #ddd; border-radius: 6px; padding: .5rem; max-height: 20rem; overflow: auto; }
    .entry { border-top: 1px solid #ddd; padding-top: .5rem; margin-top: 1.5rem; }
    .entry h2 { margin-bottom: .2rem; }
    .entry blockquote { margin: .5rem 0; padding-left: .8rem; border-left: 3px solid #ddd; }
    details.run { border: 1px solid #ddd; border-radius: 8px; padding: .5rem .8rem; margin: .5rem 0; }
    .badge.contradicted { background: #fde7e9; color: #8a1c1c; } .badge.supported { background: #e6f4ea; color: #1b5e20; }
    table.cells td.cell { border-left: 3px solid #ddd; }
    table.cells td.shown { border-left-color: #2e7d32; }
    table.cells td.unverified, table.cells td.supported { border-left-color: #b26a00; color: #777; }
    table.cells td.contradicted { border-left-color: #b00020; background: #fff5f5; }
    #working { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #fff8e1; border-bottom: 1px solid #e0c060; padding: .5rem 1rem; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    #working.on { display: block; }
    #working .track { height: 4px; background: #f0e2b0; border-radius: 2px; margin-top: .4rem; overflow: hidden; }
    #working .fill { height: 100%; width: 30%; background: #b26a00; border-radius: 2px; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
    form.busy button, form.busy input, form.busy textarea, form.busy select { opacity: .6; pointer-events: none; }
  </style>
</head>
<body>
<nav>
  {% if HAS_PANEL %}<a href="/">Dashboard</a>
  <a href="/sources">Sources</a>
  <a href="/feed">Feed</a>
  <a href="/runs">Runs</a>
  <span class="sep">|</span>
  {% endif %}<a href="/queue">Pending</a>
  <a href="/status/approved">Approved</a>
  <a href="/status/snoozed">Snoozed</a>
  <a href="/status/rejected">Rejected</a>
  <a href="/status/failed">Failed</a>
  <a href="/voice">Voice report</a>
  {% if HAS_PANEL %}<span class="sep">|</span>
  <a href="/publishing">Publishing</a>
  <a href="/feedback">Feedback</a>{% endif %}
</nav>
<div id="working" role="status" aria-live="polite"><span class="msg"></span><div class="track"><div class="fill"></div></div></div>
<main>{% block content %}{% endblock %}</main>
<script>
  // Long-running forms (the AI revise) give no feedback while the browser waits
  // for the redirect; show a status bar and lock the form so it is not sent twice.
  document.addEventListener("submit", function (ev) {
    var form = ev.target;
    if (!form.matches("form[action$='/revise']")) return;
    if (form.classList.contains("busy")) { ev.preventDefault(); return; }
    form.classList.add("busy");
    var bar = document.getElementById("working");
    bar.querySelector(".msg").textContent = "Revising with AI\u2026 the drafter is rewriting the post; the page reloads when it is done (usually 10\u201330 seconds).";
    bar.classList.add("on");
  });
  window.addEventListener("pageshow", function () {
    document.getElementById("working").classList.remove("on");
    document.querySelectorAll("form.busy").forEach(function (f) { f.classList.remove("busy"); });
  });
</script>
</body>
</html>
