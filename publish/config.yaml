# Publish-layer settings (step 3). This is NOT the root config.yaml.
timezone: America/New_York

# Daily posting slots, local time (HH:MM). run_publish.py is meant to run from cron every
# 15 minutes; a slot is "open" from its start until grace_minutes later, and it is used at
# most once per day. An EMPTY list (`slots: []`) turns slots off: every run then posts the
# top approved draft as soon as min_gap_minutes has passed since the last post and the
# daily cap is not reached, so the queue drains at one draft per gap, around the clock.
slots: []
grace_minutes: 20

# Automatic publishing from the control panel (run_app.py / the desktop app). While the
# app is open and this is on, it runs `run_publish.py --live` every interval (the same
# run cron would make), so approved drafts post on their own under the caps below and the
# slots above. Still nothing posts without PUBLISH_ENABLED=1 in .env. The panel's
# publishing page edits these two keys ("Automatic publishing"); cron users leave them.
auto_publish_enabled: true
auto_publish_interval_minutes: 15

# Hard limits that apply to every post, breaking news included.
max_posts_per_day: 100
min_gap_minutes: 15

# Breaking items may post outside slots (still subject to the caps above).
breaking:
  source_prefixes: ["fda", "company_"]
  # For company_* sources only: title must contain one of these (case-insensitive).
  company_title_keywords: ["approv"]

# Candidate ordering when several approved drafts compete for one slot.
policy:
  prefer_breaking: true
  order: score_desc   # score_desc | oldest_first

# Draft images (the chart run_draft.py rendered and the reviewer saw in the queue).
# attach_images: true uploads it and attaches it to the FIRST post of the thread
# with alt text; false posts text only, whatever the draft carries. An upload failure
# refuses the post rather than posting text-only, because the reviewer approved it with
# the image.
media:
  attach_images: true

# A draft whose attempt posted nothing (the image upload or the first tweet failed, and
# the error was not a permission or content problem) goes back to approved on its own, so
# the next run tries it again; after max_attempts failed attempts it stays failed for a
# human (run_publish.py --release-failed). A refused text (fails the hard checks) and a
# partial thread (some posts are live) are never released automatically.
retry:
  auto_release_failed: true
  max_attempts: 3
