# Publish-layer settings (step 3). This is NOT the root config.yaml.
timezone: America/Los_Angeles   # Seattle, WA; matches `timezone:` in the root config.yaml

# Posting is MANUAL ONLY: a draft goes out when a human presses "Publish now" on the panel's
# approved page (run_publish.py --live --now --draft ID) or runs run_publish.py --live by
# hand. Nothing posts on a timer: the panel has no automatic publisher and run_ops.py
# refuses any configured step that carries --live.
#
# Daily posting slots, local time (HH:MM), for a hand-run `run_publish.py --live` without
# --now: a slot is "open" from its start until grace_minutes later, and it is used at most
# once per day. An EMPTY list (`slots: []`) turns slots off: such a run then posts the top
# approved draft as soon as min_gap_minutes has passed since the last post and the daily
# cap is not reached. "Publish now" (--now) ignores slots either way.
slots: []
grace_minutes: 20

# Hard limits that apply to every post, breaking news included. Three a day is a ceiling,
# not a target: an unanswered post teaches the ranker that this account is skippable, so
# fewer posts that the operator can stay with beat a full queue drained overnight.
max_posts_per_day: 3
min_gap_minutes: 15

# Breaking items may post outside slots (still subject to the caps above).
breaking:
  source_prefixes: ["fda", "company_"]
  # For company_* sources only: title must contain one of these (case-insensitive).
  company_title_keywords: ["approv"]

# Candidate ordering when several approved drafts compete for one slot.
policy:
  prefer_breaking: true
  order: score_desc   # score_desc | oldest_first

# Draft images (the chart run_draft.py rendered and the reviewer saw in the queue).
# attach_images: true uploads it and attaches it to the FIRST post of the thread
# with alt text; false posts text only, whatever the draft carries. An upload failure
# refuses the post rather than posting text-only, because the reviewer approved it with
# the image.
media:
  attach_images: true

# " (n/N)" after the posts of a thread. replies (shipped): every post but the opening one,
# which X shows to people who do not follow the account and which rule 12 keeps free of a
# position marker (the client already shows the thread). all: every post. none: no numbers.
thread_numbering: replies

# A draft whose attempt posted nothing (the image upload or the first tweet failed, and
# the error was not a permission or content problem) goes back to approved on its own, so
# the next publish run you start tries it again; after max_attempts failed attempts it
# stays failed for a human (run_publish.py --release-failed). A refused text (fails the hard checks) and a
# partial thread (some posts are live) are never released automatically.
retry:
  auto_release_failed: true
  max_attempts: 3
