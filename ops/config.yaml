# Step 5 (operations) settings. This is ops' own file; the root config.yaml
# still drives every pipeline stage. Relative paths are resolved from the
# working directory, which the cron/systemd entries `cd` to the repo root.

# Steps run in this order by `run_ops.py run`. argv[0] "python" is replaced by
# the interpreter that runs run_ops.py (the venv's). A step whose CLI file
# does not exist on this checkout is skipped with a WARNING ("not merged").
# A failing `required` step stops the run; a failing optional step is logged
# and the run continues.
steps:
  # Each step runs under a lock of its own (<lock_path>.<lock name>), so different steps
  # run at the same time from the panel, other desktop windows and cron, and the same step
  # never runs twice at once. Ingest and score share the "stories" lock: story linking in
  # score merges and deletes clusters that ingest may be adding items to.
  - name: ingest
    lock: stories
    argv: ["python", "run_ingest.py"]
    enabled: true
    required: true
    timeout_seconds: 900
  - name: score
    lock: stories
    argv: ["python", "run_score.py"]
    enabled: true
    required: true
    # No time limit (0): a large backlog is ~25s per batch of 10 and can run past an hour.
    # Scores are stored per batch, so the Stop button loses only the batch in flight.
    timeout_seconds: 0
  # Step 10's radar (studio/config.yaml `radar`): at most once a day (scan_every_hours),
  # one call on the writer's model with web search proposes the next topics and reports
  # dated catalysts for the calendar on /studio/radar. Right before the studio step, so
  # the day's automatic piece is offered today's topics. Its own lock: it never waits for
  # a session. No time limit (0): the scan has its own (radar.timeout_minutes).
  - name: studio_scan
    lock: studio_scan
    argv: ["python", "run_studio.py", "--scan"]
    enabled: true
    required: false
    timeout_seconds: 0
  # Manual only (the radar page's "Scan now"): the same, whatever the time since the last.
  - name: studio_scan_now
    lock: studio_scan
    argv: ["python", "run_studio.py", "--scan-now"]
    enabled: true
    required: false
    manual: true
    timeout_seconds: 0
  # Step 10, the studio (run_studio.py, studio/config.yaml): one long Opus session per
  # post. Each run acts on the editor's requests from the studio page, then starts a new
  # piece when studio/config.yaml's `auto` limits allow (at most one a day as shipped). In
  # the automatic runs it sits right after score so it sees the freshest stories, and
  # before draft so a story it takes is not also drafted as a short thread (run_draft.py
  # skips a story a studio piece or queued topic holds, whatever the piece's stage, and
  # every story offered to a piece still researching, so a draft step running beside a
  # session, as under cron, leaves those alone too). No
  # time limit (0): a session is research, writing, a cold fact-check and cards, often an
  # hour; each stage has its own limit in studio/config.yaml, and a stopped piece resumes
  # from the studio page. skip_when_busy: in the automatic runs a session still running at
  # the next run time sits that run out instead of holding the other steps back. A plain
  # `run_ops.py run` (cron, Task Scheduler, systemd) leaves it out: it has a schedule
  # entry of its own, `run_ops.py run --only studio` (HOWTO part 6, deploy/), which takes
  # only the studio lock, never the run lock the pipeline's fires take.
  - name: studio
    lock: studio
    argv: ["python", "run_studio.py"]
    enabled: true
    required: false
    skip_when_busy: true
    timeout_seconds: 0
  # Manual only (the studio page's buttons): start a piece now, whatever the limits, and
  # act on the editor's Continue / Revise / Resume requests. Both share the studio lock,
  # so one studio run at a time.
  - name: studio_now
    lock: studio
    argv: ["python", "run_studio.py", "--now"]
    enabled: true
    required: false
    manual: true
    timeout_seconds: 0
  - name: studio_resume
    lock: studio
    argv: ["python", "run_studio.py", "--resume-only"]
    enabled: true
    required: false
    manual: true
    timeout_seconds: 0
  # No time limit (0): every swarm cell is one CLI launch and a story is ~110 of them
  # at the planned fan_out and layers, so a run can take an hour or more. Drafts are
  # stored as they land, so the runs page's Stop button loses only the story in flight.
  - name: draft
    argv: ["python", "run_draft.py"]
    enabled: true
    required: true
    timeout_seconds: 0
  # Manual only (the pending page's "Retry failed" button, or run_ops.py run --only
  # draft_retry): draft again the stories whose only drafts failed the hard rules,
  # looking back 20 days rather than draft's 48 hours. A plain run and the automatic
  # runs never start it; it shares draft's lock so the two never run at once.
  - name: draft_retry
    argv: ["python", "run_draft.py", "--retry-failed", "--since-hours", "480", "--limit", "10"]
    enabled: true
    required: false
    manual: true
    lock: draft
    timeout_seconds: 0
  # Step 2b: check each new draft's claims against the web and attach the evidence so
  # the queue shows it. Optional: a failure here leaves the claims "unchecked", never
  # blocks the run. No time limit (0): each claim is one web-search call of a minute
  # or more and a backlog can take an hour. Every verdict is saved as it lands, so
  # the runs page's Stop button (or a usage limit) only loses the claim in flight.
  - name: verify
    argv: ["python", "run_verify.py"]
    enabled: true
    required: false
    timeout_seconds: 0
  # Publishing here is a dry run and stays one: run_publish.py without flags only
  # prints what it would post. Posting is manual only (the panel's "Publish now",
  # or run_publish.py with its live flag run by hand), so run_ops.py refuses to
  # start when any step here carries that flag, and a test asserts this file
  # never contains it.
  - name: publish
    argv: ["python", "run_publish.py"]
    enabled: true
    required: false
    timeout_seconds: 300
  # Daily metrics snapshot (step 4). Needs the paid X API read tier and
  # X_BEARER_TOKEN in .env. Without the token the step fails with an ERROR in the
  # log, and being optional it never stops the run.
  - name: feedback
    argv: ["python", "run_feedback.py", "snapshot"]
    enabled: true
    required: false
    timeout_seconds: 300
  # Step 9 phase two: score posted swarm drafts against X and retire losing genomes.
  # No network; it reads the snapshots the feedback step just took.
  - name: evolve
    argv: ["python", "run_evolve.py"]
    enabled: true
    required: false
    timeout_seconds: 0             # breed makes one CLI call per writer child
  # Step 10's learning loop (studio/config.yaml `learn`): measure the posted studio pieces
  # on the snapshots the feedback step just took (or the numbers typed in on the
  # performance page) and, once enough scored pieces are new to it, rewrite the playbook
  # the next session reads in one CLI call. Starts no piece; its own lock, so it never
  # waits for a studio session. No time limit (0): the rewrite has its own
  # (learn.timeout_minutes).
  - name: studio_learn
    lock: studio_learn
    argv: ["python", "run_studio.py", "--learn"]
    enabled: true
    required: false
    timeout_seconds: 0
  # Manual only (the performance page's "Rewrite the playbook now"): the same, rewriting
  # whatever the counts.
  - name: studio_learn_now
    lock: studio_learn
    argv: ["python", "run_studio.py", "--learn-now"]
    enabled: true
    required: false
    manual: true
    timeout_seconds: 0

lock_path: ./pipeline.lock       # overlapping cron fires exit 2; steps lock <lock_path>.<name>
run_log_tail_chars: 4000         # stdout/stderr kept per step per run

# Automatic runs: while the control panel (run_app.py) or the desktop window
# (run_desktop.py) is open, it runs the steps below on its own at each time of day,
# local time in the root config.yaml `timezone:`. Everything but publishing: only
# ingest, score, draft, verify, feedback, evolve and studio can ever start this way (checked by
# the script a step runs, not its name, in ops/autorun.py), those runs cannot post
# whatever .env says, and posting stays the approved page's "Publish now".
# The runs page's switch and time field edit auto_run_enabled and auto_run_times (the
# only two keys the panel writes in this file); the step list is edited here, and the
# app restarted. At most 8 times a day, at least an hour apart. A time that passed while
# the app was closed is not made up; one missed while the computer slept runs on wake if
# it is less than auto_run_grace_minutes late, and a time whose steps are still running
# from the last run waits that long for them. Running these and a Task Scheduler
# pipeline-run (HOWTO Part 6) together is safe but wasteful: pick one.
auto_run_enabled: true
auto_run_times: ["06:00", "12:00", "18:00"]
auto_run_steps: [ingest, score, studio_scan, studio, draft, verify, feedback, evolve, studio_learn]
auto_run_grace_minutes: 60
# Daily backup: an automatic run that starts when the newest backup in backups.dir is
# older than this many hours also takes one, beside the run (the same verified backup as
# the dashboard's "Back up now", rotated to backups.keep), so the day's first run backs up.
# 0 turns it off.
auto_run_backup_hours: 20

health:
  # Staleness: 'warn' past the threshold, 'fail' past twice the threshold.
  # Sized for the automatic runs above: the longest gap between auto_run_times is 12h
  # (18:00 to 06:00), so a quiet night is not stale and a missed run day is 'fail'.
  # Tighten these (e.g. 3 and 6) if the Task Scheduler runs every 30 minutes instead.
  max_hours_since_ingest: 13     # 'warn' past one run gap, 'fail' past two
  max_hours_since_score: 13      # 0 unscored clusters is normal; a backlog older than this is not
  max_hours_since_draft: 48      # drafts only appear when something clears the score threshold
  source_stale_multiplier: 3     # a source is stale when last_run_at > multiplier * cadence,
  source_stale_min_hours: 13     # but never before this many hours (the night's run gap)
  max_source_failure_fraction: 0.34   # (error + never ran + stale) / enabled sources -> 'fail'
  pending_draft_max_age_hours: 72     # a draft nobody has reviewed in 3 days -> 'warn'
  unscored_backlog_max: 100      # prefilter-passed clusters with no score ('warn'; 'fail' at 2x)
  # Usage caps: every model call runs on the Claude account the CLI is logged in with,
  # whose rolling usage limits your own Claude Code sessions share, so these flag a step
  # doing far more model work than a normal day:
  #   scoring: scores written in 24h; prefilter.daily_cap bounds a normal day, and a
  #            PROMPT_VERSION bump re-scores the backlog on top of it.
  #   drafting: PLAN.md advances the top 5-10/day, so 15/day leaves headroom.
  # Exceeding a cap is 'fail', 80% of it is 'warn'.
  scores_per_day_max: 150
  drafts_per_day_max: 15
  db_max_mb: 2048                # SQLite file size ('warn')
  disk_min_free_mb: 1024         # free space on the DB's filesystem ('fail')
  backup_max_age_hours: 36       # backups run daily; 'fail' past this, 'warn' if none yet
  feedback_max_age_hours: 192    # step 4 snapshots taper to weekly; 'warn' past 8 days
  # Env vars the pipeline cannot run without (names only; values are never read into a
  # report). Claude needs none: every model call goes through the Claude Code CLI and
  # its own login, which the "cli" check looks for on PATH instead.
  required_env: []

backups:
  dir: ./backups
  keep: 14                       # newest N copies are kept (daily -> two weeks)
  # Files in the database's folder that only live there, copied with every backup as
  # pipeline-<stamp>.<name> and rotated with it; one that is not there yet is skipped. The
  # studio's playbook is the editor's own text, written on the studio page. (Each studio
  # piece's folder, studio_pieces/, is too big to copy every day: keep it when the data
  # folder is moved or the desktop app rebuilt, HOWTO part 8.)
  with_db: [studio_playbook.md]

alerts:
  cooldown_hours: 6              # same check, same status: do not re-send within this window
  min_status: warn               # send 'warn' and 'fail' (set to fail to send only failures)
  channels:
    log: true                    # always on: WARNING for warn, ERROR for fail
    webhook: true                # JSON POST {"text": ...} to ALERT_WEBHOOK_URL (skipped if unset)
    email: false                 # smtplib via SMTP_* and ALERT_EMAIL_FROM/TO (skipped if unset)
  webhook_timeout_seconds: 10
