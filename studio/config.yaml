# The studio's own settings (studio/settings.py). Not the root config.yaml.
#
# The studio hands each post to ONE long Claude Code session: research, a fact base,
# the post, its own cold fact-check through a sub-agent and the cards, the way the
# account's best posts were made by hand. The app picks the topic, asks for variety,
# checks the result and puts it in the approval queue. Posting stays manual.

# The writer. Opus 5.5 at max effort for every stage: the account is judged on these.
model: claude-opus-5-5
effort: max                     # low | medium | high | xhigh | max

# What the automatic run (`python run_studio.py`, the `studio` step in ops/config.yaml)
# may start on its own. A button press (`--now`) ignores both limits.
auto:
  enabled: true
  max_new_per_day: 1            # new pieces started automatically in any 24 hours
  min_hours_between: 6          # since the last piece started, automatic or manual
  # Stop after the research stage so a human reads the fact base and says "continue"
  # (with notes) before the post is written. Off for automatic pieces: the finished
  # piece waits in the queue with its fact base and fact-check log, and "Revise" on the
  # studio page resumes the same session with your notes.
  checkpoint: false

# The default for a piece started from the panel or with --topic.
manual:
  checkpoint: true

# Where each piece's files live: the fact base, the posts, the cards, the session log.
# Relative to the data folder (the repo, or the folder Pipeline.exe sits in).
workspace_dir: studio_pieces

# Limits per stage, in minutes (0 = no limit). A session that hits one is killed and can
# be resumed from the studio page; nothing it wrote is lost.
timeouts:
  research: 150
  write: 180
  polish: 60
  revise: 120
# Turns per stage (0 = no limit). A turn is one model call; research runs dozens.
max_turns:
  research: 0
  write: 0
  polish: 40
  revise: 0
# Rounds of "here is what the checker found, fix it" before the piece is handed over
# with the remaining problems listed.
max_polish_rounds: 3

# What the session may use. Read/Write/Edit only reach its own folder and the reference
# folder; there is no shell. WebSearch/WebFetch are the research; Agent runs the cold
# fact-check as a fresh sub-agent.
tools: [Read, Write, Edit, Glob, Grep, WebSearch, WebFetch, Agent]
# CLI switches that isolate the session from this machine: no CLAUDE.md, plugins, hooks
# or MCP servers (--safe-mode), file tools confined to the working folders and no
# command-running tools (--restricted), and anything not pre-approved is denied rather
# than prompted for (--permission-mode dontAsk). Remove one only if your CLI version
# rejects it.
cli_flags: [--safe-mode, --restricted, --permission-mode, dontAsk]

# Topic choice for automatic pieces: the top scored stories of the last `lookback_hours`
# from step 1 that the account has not written about yet (no studio piece or queued topic
# on them, and no draft that did not fail) are offered as a shortlist; the session picks
# one or finds a better story itself with a news scan.
topics:
  lookback_hours: 48
  shortlist: 8
  min_score: 30                 # scoring total (0-50) a story needs to be offered
  # Every piece started in the last avoid_days days that was not discarded, finished or
  # still being made (waiting at the checkpoint, stopped), is listed to the research stage
  # with its title and companies as a topic not to repeat. 0 lists none.
  avoid_days: 10

# Variety: the session is never offered an angle used in the last N pieces, and is told
# which hook styles and openers were used recently.
variety:
  avoid_recent_angles: 3
  avoid_recent_hooks: 2
  recent_pieces_shown: 8         # the last N written pieces hooks, shapes and openings vary from

# X limits the checker enforces (characters weighted the way X counts them).
x:
  long_post_max: 25000          # X Premium long post
  thread_post_max: 25000        # each post of a thread of long posts
  short_post_max: 1000          # the "short post" format's target, not an X limit
  headroom: 50                  # stay this far under a limit
  max_cards_total: 4            # pictures per piece (X allows 4 per post)

# The card renderer (studio/render.py). Blank = find Edge, Chrome or Chromium.
# STUDIO_BROWSER in .env overrides.
render:
  browser: ""
  timeout_seconds: 60

# The radar (studio/radar.py, studio/scan.py, /studio/radar): where topics come from.
# Once a day (`python run_studio.py --scan`, the `studio_scan` step, before `studio`) one
# call on the writer's model with web search reads the last few days of news and proposes
# the account's next 3-5 topics, each with why now, a suggested angle and its sources, and
# reports the dated catalysts coming up (PDUFA dates, readouts, conference slots). Every
# piece's research adds the catalysts it found. The radar page shows the topics, the
# feed's top stories and the catalyst calendar, each with "Write it"; an automatic piece
# is offered the same and picks one, or finds something better.
radar:
  enabled: true
  scan_every_hours: 20          # one scan a day at most; "Scan now" ignores it
  model: ""                     # blank = the writer's model above
  effort: ""                    # blank = the writer's effort above
  timeout_minutes: 40           # one scan's limit
  max_topics: 5
  max_catalysts: 40             # per scan
  topic_days: 3                 # a scan's topics stay on the radar this long
  calendar_days: 180            # catalysts further out are left off the calendar
  past_days: 14                 # catalysts that passed stay this long, for reaction pieces
  brief_upcoming_days: 21       # what an open piece is shown as coming up
  brief_recent_days: 3          # and as just passed
  feed_stories: 10              # the feed's top stories on the radar page

# What X says, fed back into the next piece (studio/learn.py, studio/evidence.py). Each
# posted piece is measured on its first post `horizon_hours` after it went out (step 4's
# snapshot, or the numbers typed in on the performance page) and compared with the median
# of every post the account made in the `baseline_days` before it. From those scores every
# session is shown what has done well (by angle, shape, hook style and card count, with
# the sample sizes), offered a lean (a Thompson draw: what has done better is suggested
# more often, what has little evidence is still tried) and, after enough new pieces, reads
# a playbook rewritten from the evidence and your hand edits. `python run_studio.py
# --learn` (the `studio_learn` step) does the measuring and the rewrite; nothing here posts.
learn:
  enabled: true
  kpi: conversation             # feedback/models.py: replies, quotes x3; bookmarks, reposts x2; likes x1; impressions x0.05
  horizon_hours: 48             # a post is compared at this age (typed-in numbers as they are)
  baseline_days: 30             # against the median of the account's posts in these days before it
  min_baseline_posts: 3         # fewer posts than this before it: measured, not yet scored
  smoothing: 1.0                # added to both sides, so a quiet account still compares
  lean_min_measured: 3          # scored pieces before the brief suggests a lean
  prior_sd: 0.5                 # how far from the median an untried angle may plausibly be (log scale)
  post_sd: 0.8                  # one post's spread (log scale) until 10 pieces measure it
  # The playbook rewrite: one call (no tools) once `rewrite_min_new` scored pieces are new
  # to it, at most every `rewrite_min_hours`. propose (shipped): it waits on the
  # performance page for you to read and apply, since a handful of posts is mostly noise
  # (the numbers mean little before 20 to 30 pieces); auto: the next session reads it at
  # once; off: never rewritten. Every version is kept there with its changelog, and any
  # one can be put back.
  playbook: propose
  rewrite_min_new: 3
  rewrite_min_hours: 24
  model: ""                     # blank = the writer's model above
  effort: ""                    # blank = the writer's effort above
  max_words: 900                # the playbook's length limit
  timeout_minutes: 30
