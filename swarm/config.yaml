# Step 9 (swarm drafting) settings. This is swarm/'s own file, NOT the root config.yaml.
# Loaded by swarm.settings.load_swarm_config(). Nothing here changes what is ingested,
# scored, verified or posted; it controls how run_draft.py writes a draft.

enabled: true

# The cheap model behind every cell, synthesiser and judge call. The whole point of the
# swarm is many narrow calls on a small model; the strong drafter runs as the control.
model: claude-haiku-4-5-20251001
# The assembly call (chosen cells -> the step 2 JSON with visual and claims). Blank means
# the same model as above.
assembler_model: ""

fan_out: 6          # proposals per slot per layer
layers: 2           # 1 = proposals only; 2 and up add Mixture-of-Agents synthesis layers
judge_votes: 3      # odd; the swarm-vs-control jury size (ties go to the control)
max_similarity: 0.85  # difflib ratio at or above which a later candidate is a near twin and dropped

control:
  enabled: true     # also run the single strong drafter (draft_item) and let the jury pick

# Phase four: the format is a gene (swarm/genome.py SEED_FORMATS: thread with one picture,
# thread with two, thread with none, single post, long post), drafted round-robin like the
# writers and designers. Both the swarm and the control write to the same format on a story.
formats:
  long_max_chars: 4000      # a long post's limit at draft time (X allows 25000 on Premium;
                            #   the API rejects a long post from a non-Premium account)
  long_section_chars: 700   # each swarm cell of a long post (sections joined by blank lines)

# Phase two (run_evolve.py): fitness from X and pruning. No network; reads step 3's posts
# and step 4's tweet_metrics (run_feedback.py snapshot fills those).
evolve:
  kpi: impressions          # impressions | likes | reposts | replies | quotes | bookmarks
  baseline_days: 30         # a post's score is its KPI / the median KPI of the posts in
                            #   the trailing window before it, so a slow week prunes nobody
  min_baseline_posts: 3     # fewer earlier posts in the window -> no relative score yet
  min_posts: 5              # a genome is judged only after this many scored posts
  min_alive: 2              # pruning never leaves fewer live genomes than this
  format_min_posts: 8       # a format is a coarse gene: judged only after this many posts
  format_population_size: 5 # how many live formats breed keeps
  # Phase three (run_evolve.py breed): keep this many live writer genomes; each gap after
  # pruning is filled by one child of a top scorer.
  population_size: 3
  # Live designers (a draft.chart.Style preset: palette, one hue per bar, layout knobs).
  # Colour is cheap to vary, so more of them stay alive than writers and the pictures
  # keep changing from card to card.
  designer_population_size: 6
  # The one strong model in the loop: writes a writer child that varies exactly one thing
  # (a slot rule, a split or merge, fan_out, layers). Blank = the drafting model
  # (DRAFT_MODEL / models.drafter / draft/config.yaml). Designer children need no model.
  mutation_model: ""
