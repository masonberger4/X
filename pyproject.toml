[project]
name = "cancer-research-x"
version = "0.1.0"
description = "AI-assisted ingest, scoring, and drafting pipeline for a cancer-research X account (human-in-the-loop)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "biopython>=1.84",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "tweepy>=4.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "db", "digest", "run_ingest", "run_score", "run_draft", "run_queue", "run_publish", "run_ops"]

[tool.setuptools.packages.find]
include = ["ingest*", "filter*", "score*", "draft*", "approval_queue*", "publish*", "ops*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"score/rubric.py" = ["E501"]  # prompt text and few-shot examples are long by nature

[tool.pytest.ini_options]
testpaths = ["tests"]
