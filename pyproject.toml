[project]
name = "cancer-research-x"
version = "0.1.0"
description = "AI-assisted ingest, scoring, and drafting pipeline for a cancer-research X account (human-in-the-loop)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "biopython>=1.84",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "tweepy>=4.14",
    "tzdata; sys_platform == 'win32'",  # Windows has no system time zone database
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]
# The desktop window (run_desktop.py) and the build that turns it into Pipeline.exe
# (deploy/desktop.spec). The pipeline itself never needs either.
desktop = [
    "pywebview>=5.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "claude_cli", "db", "digest", "run_ingest", "run_score", "run_draft", "run_queue", "run_app", "run_desktop", "pipeline_cli", "run_publish", "run_feedback", "run_ops", "run_verify"]

[tool.setuptools.packages.find]
include = ["ingest*", "filter*", "score*", "draft*", "approval_queue*", "panel*", "publish*", "feedback*", "ops*", "verify*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"score/rubric.py" = ["E501"]  # prompt text and few-shot examples are long by nature
"score/rater.py" = ["E501"]   # same: the rater's prompt text
"verify/verifier.py" = ["E501"]  # same: the verifier's prompt text
"filter/link.py" = ["E501"]  # same: the story linker's prompt text

[tool.pytest.ini_options]
testpaths = ["tests"]
